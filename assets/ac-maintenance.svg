<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1e30"/><stop offset="100%" stop-color="#091525"/></linearGradient>
    <linearGradient id="skin3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e0a070"/><stop offset="100%" stop-color="#c87848"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg3)"/>
  <rect x="0" y="480" width="800" height="120" fill="#060d15"/>
  <!-- Split AC on high wall -->
  <rect x="100" y="80" width="340" height="100" rx="10" fill="#b8cfe0" stroke="#8aaccc" stroke-width="1.5"/>
  <rect x="110" y="92" width="320" height="14" rx="4" fill="#90b0cc"/>
  <line x1="110" y1="120" x2="430" y2="120" stroke="#7090ac" stroke-width="1.5" opacity="0.7"/>
  <line x1="110" y1="130" x2="430" y2="130" stroke="#7090ac" stroke-width="1.5" opacity="0.7"/>
  <line x1="110" y1="140" x2="430" y2="140" stroke="#7090ac" stroke-width="1.5" opacity="0.7"/>
  <line x1="110" y1="150" x2="430" y2="150" stroke="#7090ac" stroke-width="1.5" opacity="0.7"/>
  <line x1="110" y1="160" x2="430" y2="160" stroke="#7090ac" stroke-width="1.5" opacity="0.7"/>
  <!-- Panel removed (maintenance) -->
  <rect x="140" y="86" width="150" height="50" rx="4" fill="#0d1e30" stroke="#C8A96E" stroke-width="1.5" opacity="0.9"/>
  <!-- Dust/dirt particles being cleaned -->
  <circle cx="185" cy="200" r="3" fill="#8a8a7a" opacity="0.6"/>
  <circle cx="210" cy="215" r="2" fill="#8a8a7a" opacity="0.5"/>
  <circle cx="230" cy="205" r="4" fill="#8a8a7a" opacity="0.4"/>
  <circle cx="170" cy="220" r="2.5" fill="#8a8a7a" opacity="0.6"/>
  <circle cx="250" cy="212" r="3" fill="#8a8a7a" opacity="0.5"/>
  <!-- Spray bottle / cleaner -->
  <rect x="600" y="200" width="50" height="80" rx="8" fill="#2C5F8A" stroke="#4a80b0" stroke-width="1.5"/>
  <rect x="640" y="215" width="28" height="18" rx="4" fill="#1a4a70"/>
  <path d="M665 224 Q700 210 720 200" stroke="#a0d8f8" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M665 226 Q702 220 725 218" stroke="#a0d8f8" stroke-width="1.5" fill="none" opacity="0.4"/>
  <!-- Technician standing on small step -->
  <rect x="460" y="400" width="100" height="20" rx="4" fill="#162a3f" stroke="#C8A96E" stroke-width="1"/>
  <!-- Legs -->
  <rect x="480" y="350" width="22" height="80" rx="8" fill="#1a3a5c"/>
  <rect x="512" y="350" width="22" height="80" rx="8" fill="#1a3a5c"/>
  <ellipse cx="491" cy="430" rx="15" ry="9" fill="#0a1628"/>
  <ellipse cx="523" cy="430" rx="15" ry="9" fill="#0a1628"/>
  <!-- Torso -->
  <rect x="465" y="220" width="88" height="140" rx="12" fill="#2C5F8A"/>
  <rect x="478" y="244" width="28" height="22" rx="3" fill="#1a4a70" stroke="#C8A96E" stroke-width="1"/>
  <text x="484" y="259" font-size="10" fill="#C8A96E" font-family="Arial" font-weight="bold">NT</text>
  <!-- Right arm up with brush -->
  <path d="M552 250 Q580 200 570 140" stroke="#2C5F8A" stroke-width="26" stroke-linecap="round" fill="none"/>
  <circle cx="570" cy="136" r="13" fill="url(#skin3)"/>
  <!-- Cleaning brush -->
  <rect x="555" y="70" width="12" height="66" rx="4" fill="#8B6914" transform="rotate(-10 555 70)"/>
  <rect x="548" y="64" width="26" height="16" rx="3" fill="#ddd" transform="rotate(-10 548 64)"/>
  <!-- Bristles -->
  <line x1="550" y1="78" x2="546" y2="92" stroke="#ccc" stroke-width="1.5" transform="rotate(-10 550 78)"/>
  <line x1="556" y1="78" x2="552" y2="92" stroke="#ccc" stroke-width="1.5" transform="rotate(-10 556 78)"/>
  <line x1="562" y1="78" x2="558" y2="92" stroke="#ccc" stroke-width="1.5" transform="rotate(-10 562 78)"/>
  <line x1="568" y1="78" x2="564" y2="92" stroke="#ccc" stroke-width="1.5" transform="rotate(-10 568 78)"/>
  <!-- Left arm out -->
  <path d="M466 250 Q430 240 410 220" stroke="#2C5F8A" stroke-width="24" stroke-linecap="round" fill="none"/>
  <circle cx="408" cy="217" r="12" fill="url(#skin3)"/>
  <!-- Head -->
  <circle cx="508" cy="196" r="36" fill="url(#skin3)"/>
  <ellipse cx="508" cy="170" rx="36" ry="16" fill="#2a1500"/>
  <ellipse cx="496" cy="200" rx="5" ry="5.5" fill="#0d0000" opacity="0.7"/>
  <ellipse cx="520" cy="200" rx="5" ry="5.5" fill="#0d0000" opacity="0.7"/>
  <path d="M498 212 Q508 220 518 212" stroke="#7a3a1a" stroke-width="2.5" fill="none"/>
  <!-- Safety glasses -->
  <path d="M488 196 Q496 190 504 196 Q512 202 520 196 Q528 190 536 196" stroke="#80c0e0" stroke-width="2.5" fill="none"/>
  <rect x="486" y="193" width="18" height="10" rx="4" fill="#80c0e0" opacity="0.3" stroke="#80c0e0" stroke-width="1.5"/>
  <rect x="508" y="193" width="18" height="10" rx="4" fill="#80c0e0" opacity="0.3" stroke="#80c0e0" stroke-width="1.5"/>
  <!-- Hard hat -->
  <ellipse cx="508" cy="168" rx="42" ry="18" fill="#C8A96E"/>
  <rect x="466" y="168" width="84" height="10" rx="2" fill="#b89040"/>
  <!-- Label -->
  <rect x="0" y="540" width="800" height="60" fill="rgba(0,0,0,0.45)"/>
  <text x="400" y="576" font-size="20" fill="#C8A96E" font-family="Arial" font-weight="bold" text-anchor="middle">الصيانة الدورية للمكيفات</text>
</svg>
