<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0d1e2e"/><stop offset="100%" stop-color="#080f18"/></linearGradient>
    <linearGradient id="skin5" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#d8906a"/><stop offset="100%" stop-color="#b86840"/></linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg5)"/>
  <rect x="0" y="490" width="800" height="110" fill="#050c12"/>
  <!-- Washing machine -->
  <rect x="160" y="150" width="280" height="320" rx="14" fill="#d0d8e0" stroke="#b0bcc8" stroke-width="2"/>
  <!-- Top control panel -->
  <rect x="165" y="155" width="270" height="60" rx="8" fill="#b8c4d0"/>
  <circle cx="220" cy="185" r="18" fill="#2C5F8A" stroke="#1a4a70" stroke-width="2"/>
  <circle cx="220" cy="185" r="10" fill="#1a3a5c"/>
  <line x1="220" y1="175" x2="220" y2="180" stroke="#C8A96E" stroke-width="2"/>
  <rect x="260" y="172" width="80" height="26" rx="4" fill="#1a1a2e"/>
  <text x="300" y="189" font-size="12" fill="#00e676" font-family="monospace" text-anchor="middle">30°C</text>
  <circle cx="400" cy="185" r="14" fill="#C8A96E" opacity="0.8"/>
  <!-- Door circle -->
  <circle cx="300" cy="340" r="100" fill="#1a2a3a" stroke="#a0b0be" stroke-width="3"/>
  <circle cx="300" cy="340" r="88" fill="#0d1a28" stroke="#6080a0" stroke-width="1.5"/>
  <circle cx="300" cy="340" r="72" fill="#091420" stroke="#4060a0" stroke-width="1"/>
  <!-- Water/drum -->
  <circle cx="300" cy="340" r="62" fill="#0a2040" opacity="0.9"/>
  <path d="M238 340 Q270 310 300 340 Q330 370 362 340" stroke="#4080c0" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- Door handle -->
  <rect x="388" y="330" width="12" height="30" rx="6" fill="#8090a0"/>
  <!-- Side panel open for repair -->
  <rect x="440" y="200" width="80" height="200" rx="6" fill="#0d1e30" stroke="#C8A96E" stroke-width="1.5"/>
  <!-- Pump/motor visible -->
  <circle cx="480" cy="310" r="28" fill="#1a2a3a" stroke="#C8A96E" stroke-width="1.5"/>
  <circle cx="480" cy="310" r="16" fill="#0d1520"/>
  <line x1="480" y1="295" x2="480" y2="325" stroke="#C8A96E" stroke-width="2"/>
  <line x1="465" y1="310" x2="495" y2="310" stroke="#C8A96E" stroke-width="2"/>
  <circle cx="480" cy="310" r="5" fill="#C8A96E"/>
  <!-- Technician sitting/crouching at side -->
  <!-- Legs -->
  <rect x="550" y="390" width="20" height="100" rx="8" fill="#1a3a5c"/>
  <rect x="580" y="390" width="20" height="100" rx="8" fill="#1a3a5c"/>
  <ellipse cx="560" cy="490" rx="14" ry="9" fill="#0a1628"/>
  <ellipse cx="590" cy="490" rx="14" ry="9" fill="#0a1628"/>
  <!-- Torso -->
  <rect x="535" y="260" width="84" height="140" rx="12" fill="#2C5F8A"/>
  <rect x="548" y="283" width="28" height="22" rx="3" fill="#1a4a70" stroke="#C8A96E" stroke-width="1"/>
  <text x="553" y="298" font-size="10" fill="#C8A96E" font-family="Arial" font-weight="bold">NT</text>
  <!-- Left arm working on machine -->
  <path d="M537 290 Q500 280 475 285" stroke="#2C5F8A" stroke-width="25" stroke-linecap="round" fill="none"/>
  <circle cx="473" cy="286" r="12" fill="url(#skin5)"/>
  <!-- Right arm holding tablet/manual -->
  <path d="M618 290 Q650 275 660 258" stroke="#2C5F8A" stroke-width="23" stroke-linecap="round" fill="none"/>
  <circle cx="662" cy="255" r="12" fill="url(#skin5)"/>
  <!-- Tablet -->
  <rect x="655" y="210" width="60" height="48" rx="5" fill="#1a1a2e" stroke="#4060a0" stroke-width="1.5"/>
  <rect x="659" y="214" width="52" height="36" rx="3" fill="#0d0d20"/>
  <text x="685" y="228" font-size="8" fill="#00e676" font-family="monospace" text-anchor="middle">ERROR</text>
  <text x="685" y="240" font-size="7" fill="#C8A96E" font-family="monospace" text-anchor="middle">E-02</text>
  <!-- Head -->
  <circle cx="576" cy="238" r="34" fill="url(#skin5)"/>
  <ellipse cx="576" cy="214" rx="34" ry="15" fill="#100800"/>
  <ellipse cx="564" cy="242" rx="5" ry="5" fill="#0d0000" opacity="0.7"/>
  <ellipse cx="588" cy="242" rx="5" ry="5" fill="#0d0000" opacity="0.7"/>
  <path d="M566 254 Q576 261 586 254" stroke="#7a3a1a" stroke-width="2" fill="none"/>
  <!-- Cap -->
  <ellipse cx="576" cy="212" rx="40" ry="17" fill="#C8A96E"/>
  <rect x="536" y="212" width="80" height="9" rx="2" fill="#b89040"/>
  <!-- Label -->
  <rect x="0" y="540" width="800" height="60" fill="rgba(0,0,0,0.45)"/>
  <text x="400" y="576" font-size="20" fill="#C8A96E" font-family="Arial" font-weight="bold" text-anchor="middle">إصلاح الغسالات</text>
</svg>
